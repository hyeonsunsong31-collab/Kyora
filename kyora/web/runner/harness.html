<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Kyora test harness</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #16181d; --muted: #5b6270; --line: #dde1e7;
    --ok: #127a3f; --ok-bg: #e6f5ec; --bad: #b42318; --bad-bg: #fdecea; --skip: #8a6d00; --skip-bg: #fff6d6;
    --accent: #3b5bdb; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --panel: #171a21; --text: #e8eaef; --muted: #9aa3b2; --line: #2a2f3a;
      --ok: #5ad48a; --ok-bg: #14301f; --bad: #ff8a80; --bad-bg: #3a1714; --skip: #f5cf4a; --skip-bg: #332a0a;
      --accent: #8ea4ff;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 12px 16px 32px;
         padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
  header { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  h1 { font-size: 17px; margin: 0; }
  .meta { color: var(--muted); font-size: 13px; word-break: break-all; }
  button { font: inherit; padding: 8px 14px; min-height: 40px; border-radius: 8px; border: 1px solid var(--accent);
           background: var(--accent); color: #fff; cursor: pointer; }
  button[disabled] { opacity: .55; cursor: default; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
  #status { font-weight: 600; }
  #status[data-tone="ok"] { color: var(--ok); }
  #status[data-tone="bad"] { color: var(--bad); }
  #totals { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .pill { font-size: 13px; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); }
  .pill.ok { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
  .pill.bad { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
  .pill.skip { background: var(--skip-bg); color: var(--skip); border-color: transparent; }
  #frame-wrap { position: relative; }
  #frame-wrap iframe { display: block; width: 100%; height: min(70vh, 640px); min-height: 280px; border: 1px solid var(--line);
                       border-radius: 10px; background: #000; }
  ul.list { list-style: none; margin: 0; padding: 0; }
  ul.list li { display: grid; grid-template-columns: 52px 1fr auto; gap: 8px; align-items: start; padding: 7px 0;
               border-top: 1px solid var(--line); }
  ul.list li:first-child { border-top: 0; }
  .badge { font: 600 12px/1.6 var(--mono); text-transform: uppercase; text-align: center; border-radius: 6px; }
  .badge.pass { background: var(--ok-bg); color: var(--ok); }
  .badge.fail { background: var(--bad-bg); color: var(--bad); }
  .badge.skip { background: var(--skip-bg); color: var(--skip); }
  .rid { font: 13px var(--mono); color: var(--muted); }
  .err { font: 12.5px/1.4 var(--mono); color: var(--bad); white-space: pre-wrap; word-break: break-word; margin-top: 2px; }
  .ms { font: 12px var(--mono); color: var(--muted); white-space: nowrap; }
  h2 { font-size: 14px; margin: 0 0 6px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  #shots { display: flex; flex-wrap: wrap; gap: 10px; }
  figure { margin: 0; }
  figure img { display: block; max-width: 160px; max-height: 120px; border: 1px solid var(--line); border-radius: 6px; background: #000; }
  figcaption { font-size: 12px; color: var(--muted); margin-top: 2px; }
  pre#logs { font: 12px/1.4 var(--mono); white-space: pre-wrap; word-break: break-word; max-height: 240px; overflow: auto; margin: 6px 0 0; }
  #post { font-size: 13px; }
  .empty { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Kyora browser tests</h1>
    <div class="meta" id="meta">loading…</div>
  </div>
  <button type="button" id="run-again" disabled>Run tests</button>
</header>

<section class="panel" aria-live="polite">
  <div id="status">Idle</div>
  <div id="totals"></div>
  <div id="post" class="meta"></div>
</section>

<section class="panel">
  <h2>Results</h2>
  <ul class="list" id="results"><li class="empty" style="display:block">No results yet.</li></ul>
</section>

<section class="panel">
  <h2>Syntax checks</h2>
  <ul class="list" id="syntax"><li class="empty" style="display:block">Not run yet.</li></ul>
</section>

<section class="panel">
  <h2>Screenshots</h2>
  <div id="shots"><span class="empty">None yet.</span></div>
</section>

<section class="panel">
  <h2>Game under test</h2>
  <div id="frame-wrap"></div>
</section>

<details class="panel">
  <summary>Log</summary>
  <pre id="logs"></pre>
</details>

<script src="/static/runner/kyora-test-harness.js"></script>
</body>
</html>
